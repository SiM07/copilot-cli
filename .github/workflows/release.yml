name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tags to compute the version

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 16.x

      - name: Build binaries
        run: make release # linux/darwin amd64+arm64, windows 386

      - name: Prepare assets
        working-directory: bin/local
        run: |
          mv copilot.exe copilot-windows-386.exe
          sha256sum copilot-* > checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            bin/local/copilot-* \
            bin/local/checksums.txt
