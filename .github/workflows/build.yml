name: build

on:
  push:
    branches: ['**'] # tags are handled by release.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 16.x

      - name: Build binary
        run: make build

      - name: Smoke test
        run: ./bin/local/copilot --version
